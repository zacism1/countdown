<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown to Pattaya</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="scene">
      <div class="atmosphere"></div>

      <img class="side left" src="left.JPEG" alt="Left scene" />
      <img class="side right" src="right.JPEG" alt="Right scene" />

      <div id="enemy-layer" aria-hidden="true"></div>

      <main class="card" aria-live="polite">
        <p class="eyebrow">Trip countdown</p>
        <h1>Countdown to Pattaya</h1>
        <p class="subhead" id="target-display"></p>

        <section class="countdown">
          <div class="unit">
            <span class="value" id="days">0</span>
            <span class="label">Days</span>
          </div>
          <div class="unit">
            <span class="value" id="hours">00</span>
            <span class="label">Hours</span>
          </div>
          <div class="unit">
            <span class="value" id="minutes">00</span>
            <span class="label">Minutes</span>
          </div>
          <div class="unit">
            <span class="value" id="seconds">00</span>
            <span class="label">Seconds</span>
          </div>
        </section>

        <p class="footnote" id="open-time"></p>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
